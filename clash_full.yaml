#  ------------------------------------------------------------------
#  Mihomo / Clash Meta 进阶定制配置文件 (LokHsu)
#  ------------------------------------------------------------------
#  【核心架构与功能】  
#  1. 基础网络：开启 TUN 模式（System 栈）、严格路由、以太网自动路由与 DNS 劫持，默认绑定 7897 混合端口。
#  2. 智能 DNS：采用 ARC 缓存算法与 Fake-IP 增强模式，整合本地规则直连过滤与多上游并发加密解析。  
#  3. 节点分流：基于正则自动识别地区（美/日/港/台），提供 Fallback 顺位故障切换与动态延迟检测。  
#  4. 规则路由：精确区分 AI 平台（OpenAI / Claude / Gemini 独立分流）、主流流媒体、谷歌/苹果/微软服务、Adobe 破解与广告拦截。 
#  ------------------------------------------------------------------

# --- 节点定义（请在此处添加或替换为你的节点/订阅） ---  
proxies:

# --- 全局基础设置 ---
mixed-port: 7897
allow-lan: true
ipv6: true
log-level: info
# bind-address: "*"
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090
# external-ui: ui
# external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

profile:
  store-selected: true
  store-fake-ip: true

# --- DNS 配置 ---
dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  # fake-ip-filter:
  #   - rule-set:local_rules
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
    - https://114.114.114.114/dns-query#DIRECT
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
    - https://114.114.114.114/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#🚀 节点选择
    - https://dns.google/dns-query#🚀 节点选择
  nameserver-policy:
    geosite:cn:
      - system
      - 223.5.5.5#DIRECT
      - 119.29.29.29#DIRECT
  direct-nameserver:
    - system
    - 223.5.5.5#DIRECT
    - 119.29.29.29#DIRECT

hosts:
  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  services.googleapis.cn: services.googleapis.com
  # +.mcdn.bilivideo.com:
  #   - 0.0.0.0
  # +.mcdn.bilivideo.cn:
  #   - 0.0.0.0
  # +.edge.mountaintoys.cn:
  #   - 0.0.0.0
  # +.h2.smtcdns.net:
  #   - 0.0.0.0

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60

# tun:
#   enable: true
#   stack: system
#   auto-route: true
#   strict-route: true
#   auto-redirect: true
#   auto-detect-interface: true
#   dns-hijack:
#     - any:53
#     - tcp://any:53

