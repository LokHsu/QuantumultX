# --- 全局基础设置 ---
mixed-port: 7897
allow-lan: true
ipv6: true
log-level: info
# bind-address: "*"
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090
# external-ui: ui
# external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

profile:
  store-selected: true
  store-fake-ip: true

# --- DNS 配置 ---
dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
    # fake-ip-filter:
  #   - rule-set:local_rules
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
    - https://114.114.114.114/dns-query#DIRECT
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
    - https://114.114.114.114/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#🚀 节点选择
    - https://dns.google/dns-query#🚀 节点选择
  nameserver-policy:
    geosite:cn:
      - system
      - 223.5.5.5#DIRECT
      - 119.29.29.29#DIRECT
  direct-nameserver:
    - system
    - 223.5.5.5#DIRECT
    - 119.29.29.29#DIRECT

hosts:
  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  services.googleapis.cn: services.googleapis.com

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60

