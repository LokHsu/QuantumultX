#  ------------------------------------------------------------------
#  Mihomo / Clash Meta 订阅覆写片段 (LokHsu)
#  ------------------------------------------------------------------
#  【核心架构与功能】  
#  1. 生成方式：开启规则生成并覆写原订阅，以 base/clash_base.yaml 为骨架合成完整配置。
#  2. 策略组：自定义自动选择、国外节点、节点选择、苹果/谷歌服务、AI 平台、漏网之鱼与广告拦截分组。
#  3. 节点识别：基于正则自动筛选日本/美/新加坡/韩国等境外节点，并排除机场广告信息节点。
#  4. 规则分流：精确区分 AI 平台（通用 AI + OpenAI）、谷歌与苹果服务、Global 出海、国内直连与广告拦截。
#  ------------------------------------------------------------------

custom:
  enable_rule_generator: true
  overwrite_original_rules: true
  clash_rule_base: "https://raw.githubusercontent.com/LokHsu/Rule4Hsu/master/base/clash_base.yaml"

  rulesets:
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/BanAD.list"}
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/easylist.list"}
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/easyprivacy.list"}
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/easylistchina.list"}
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/Adblock4limbo.list"}
    - {group: "🆎 AdBlock", ruleset: "clash-classic:https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/QuantumultX/rule/Peter_Lowe_adservers.list"}
    - {group: "🍎 苹果服务", ruleset: "clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list"}
    - {group: "📢 谷歌服务", ruleset: "clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list"}
    - {group: "🤖 AI Platforms", ruleset: "clash-classic:https://raw.githubusercontent.com/LokHsu/Rule4Hsu/master/rules/GPT.list"}
    - {group: "🤖 AI Platforms", ruleset: "clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list"}
    - {group: "🚀 节点选择", ruleset: "clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list"}
    # - {group: "DIRECT", ruleset: "clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaIPs/ChinaIPs.list"}
    - {group: "DIRECT", ruleset: "[]GEOIP,CN"}
    - {group: "🐟 漏网之鱼", ruleset: "[]FINAL"}

  proxy_groups:
    # - {name: "🔯 故障转移", type: fallback, rule: [".*"], url: "https://www.gstatic.com/generate_204", interval: 60, timeout: 2000}
    - {name: "♻️ 自动选择", type: url-test, rule: [".*"], url: "https://www.gstatic.com/generate_204", interval: 60, tolerance: 50} # 这里的interval只在订阅列表是proxies有效，如果是proxy-providers走的是health-check
    - {name: "🌍 国外节点", type: url-test, rule: ["(日本|Japan|美|US|United ?States|新加坡|SGP|Singapore|韩|KR|KOR|Korea)"], url: "https://www.gstatic.com/generate_204", interval: 60, tolerance: 50}
    - {name: "🚀 节点选择", type: select, rule: ["[]♻️ 自动选择", "[]DIRECT", ".*"]}
    - {name: "🍎 苹果服务", type: select, rule: ["[]DIRECT", "[]🚀 节点选择"]}
    - {name: "📢 谷歌服务", type: select, rule: ["[]🚀 节点选择", "[]🌍 国外节点", ".*"]}
    - {name: "🤖 AI Platforms", type: select, rule: ["[]🚀 节点选择", "[]🌍 国外节点", ".*"]}
    - {name: "🐟 漏网之鱼", type: select, rule: ["[]🚀 节点选择", "[]DIRECT", ".*"]}
    - {name: "🆎 AdBlock", type: select, rule: ["[]REJECT", "[]DIRECT"]}
