# --- 策略组定义 ---
proxy-groups:
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 60
    tolerance: 50
    include-all: true
    filter: .*

  - name: ✈️ 国外节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: (日本|Japan|美|US|United States|台湾|韩|KR|Korea|KOR)

  - name: 🚀 节点选择
    type: select
    include-all: true
    filter: .*
    proxies:
      - ♻️ 自动选择
      - ♻️ 故障切换
      - DIRECT
  
  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 📢 谷歌服务
    type: select
    include-all: true
    filter: .*
    proxies:
      - 🚀 节点选择
      - ✈️ 国外节点
  
  - name: 🤖 AI Platforms
    type: select
    include-all: true
    filter: (日本|Japan|美|US|United States|台湾|韩|KR|Korea|KOR)
    proxies:
      - ✈️ 国外节点
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    include-all: true
    filter: .*
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🆎 AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT

# --- 路由规则 ---
rules:
  - RULE-SET,Apple,🍎 苹果服务
  - RULE-SET,Google,📢 谷歌服务
  # - RULE-SET,GlobalScholar,🧑🏼‍🎓 全球学术
  - RULE-SET,GPT,🤖 AI Platforms
  - RULE-SET,OpenAI,🤖 AI Platforms
  - RULE-SET,Global,🚀 节点选择
  # -----------------------------
  - RULE-SET,BanAD,🛑 全球拦截
  - RULE-SET,BanProgramAD,🍃 应用净化
  - RULE-SET,BanEasyList,🆎 AdBlock
  - RULE-SET,BanEasyListChina,🆎 AdBlock
  - RULE-SET,BanEasyPrivacy,🆎 AdBlock
  # -----------------------------
  - RULE-SET,ChinaIPs,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🐟 漏网之鱼
